name: deploy

on:
  push:
    branches: [main, dev]

env:
  IMAGE_API: ghcr.io/findardi/rakda-api
  IMAGE_WEB: ghcr.io/findardi/rakda-web
  IMAGE_MIGRATE: ghcr.io/findardi/rakda-migrate

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
      - run: go test ./...
        working-directory: server
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
        working-directory: web
      - run: bun run check
        working-directory: web

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: server
          file: docker/server.Dockerfile
          target: runtime
          push: true
          tags: ${{ env.IMAGE_API }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,scope=server,mode=max
      - uses: docker/build-push-action@v6
        with:
          context: server
          file: docker/server.Dockerfile
          target: migrate
          push: true
          tags: ${{ env.IMAGE_MIGRATE }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,scope=server,mode=max
      - uses: docker/build-push-action@v6
        with:
          context: web
          file: docker/web.Dockerfile
          push: true
          tags: ${{ env.IMAGE_WEB }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  # Skema bergerak SEBELUM tag channel bergerak — updater di server (systemd
  # timer podman compose pull) tidak pernah menarik image yang skemanya belum
  # siap. main → database prod + tag :main; dev → database rakda_dev (instance
  # managed yang sama, database terpisah) + tag :dev. Managed PG harus menerima
  # koneksi runner GitHub (SSL wajib; atur trusted sources di provider).
  migrate:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: read
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - env:
          GOOSE_DBSTRING: ${{ github.ref_name == 'main' && secrets.PROD_GOOSE_DBSTRING || secrets.DEV_GOOSE_DBSTRING }}
        run: |
          docker run --rm -e GOOSE_DRIVER=postgres -e GOOSE_DBSTRING \
            ${{ env.IMAGE_MIGRATE }}:sha-${{ github.sha }} up

  promote:
    needs: [build, migrate]
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          docker buildx imagetools create -t ${{ env.IMAGE_API }}:${{ github.ref_name }} ${{ env.IMAGE_API }}:sha-${{ github.sha }}
          docker buildx imagetools create -t ${{ env.IMAGE_WEB }}:${{ github.ref_name }} ${{ env.IMAGE_WEB }}:sha-${{ github.sha }}
          docker buildx imagetools create -t ${{ env.IMAGE_MIGRATE }}:${{ github.ref_name }} ${{ env.IMAGE_MIGRATE }}:sha-${{ github.sha }}
