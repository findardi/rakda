# VPS dev terpisah — Podman ROOTFUL, updater = systemd timer rakda-dev-update
# (docker/systemd/). Server hanya PULL dari GHCR; kanal tag = :dev, digerakkan
# deploy-dev.yml pada push ke branch dev. DB & storage = managed yang sama
# dengan prod (database rakda_dev + bucket dev), bukan container.
name: rakda-dev-server

networks:
  rakda:
    ipam:
      config:
        - subnet: 172.30.0.0/24

services:
  gotenberg:
    image: gotenberg/gotenberg:8.36
    command: ['gotenberg', '--api-timeout=150s']
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:3000/health']
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 1g
    restart: unless-stopped
    networks:
      - rakda

  api:
    image: ghcr.io/findardi/rakda-api:dev
    env_file:
      - .env.dev.api
    depends_on:
      gotenberg:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:8080/check']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    mem_limit: 1536m
    restart: unless-stopped
    networks:
      - rakda

  web:
    image: ghcr.io/findardi/rakda-web:dev
    env_file:
      - .env.dev.web
    environment:
      # Traefik meng-append tepat satu hop XFF; XFF_DEPTH=1 mengambil hop itu
      ADDRESS_HEADER: x-forwarded-for
      XFF_DEPTH: '1'
    depends_on:
      api:
        condition: service_healthy
    mem_limit: 256m
    restart: unless-stopped
    networks:
      rakda:
        ipv4_address: 172.30.0.11

  traefik:
    image: traefik:v3.7
    ports:
      - '80:80'
      - '443:443'
    volumes:
      # static config dipakai bersama prod — isinya agnostik lingkungan
      - ./traefik/traefik-prod.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic-dev-server.yml:/etc/traefik/dynamic.yml:ro
      - letsencrypt:/letsencrypt
    depends_on:
      web:
        condition: service_started
    healthcheck:
      test: ['CMD', 'traefik', 'healthcheck', '--ping']
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 128m
    restart: unless-stopped
    networks:
      rakda:
        ipv4_address: 172.30.0.10

  migrate:
    image: ghcr.io/findardi/rakda-migrate:dev
    profiles:
      - tools
    env_file:
      - .env.dev.api
    networks:
      - rakda

volumes:
  letsencrypt:
