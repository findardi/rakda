http:
  routers:
    web:
      # GANTI dev.example.com dengan domain server dev — samakan dengan ORIGIN
      # (.env.dev.web) dan WEB_URL (.env.dev.api)
      rule: Host(`dev.example.com`)
      entryPoints:
        - websecure
      service: web
      tls:
        certResolver: le
  services:
    web:
      loadBalancer:
        servers:
          - url: http://web:3000
