http:
  routers:
    web:
      # GANTI example.com dengan domain produksi — samakan dengan ORIGIN
      # (.env.prod.web) dan WEB_URL (.env.prod.api)
      rule: Host(`app.example.com`)
      entryPoints:
        - websecure
      middlewares:
        - cloudflare-only
      service: web
      tls:
        certResolver: le
  middlewares:
    # Kunci origin: hanya edge Cloudflare yang boleh mencapai router web.
    # Tanpa ini aturan rate-limit Cloudflare dilewati lewat IP VPS langsung,
    # dan trustedIPs di traefik-prod.yml kehilangan artinya. Dinilai dari
    # alamat peer (bukan XFF), jadi tidak bisa dipalsukan. Tantangan ACME dan
    # redirect :80 berada di level entryPoint — tidak terpengaruh.
    # Sumber: cloudflare.com/ips-v4 + ips-v6 (2026-09-04); samakan dengan
    # trustedIPs di traefik-prod.yml bila berubah.
    cloudflare-only:
      ipAllowList:
        sourceRange:
          - 173.245.48.0/20
          - 103.21.244.0/22
          - 103.22.200.0/22
          - 103.31.4.0/22
          - 141.101.64.0/18
          - 108.162.192.0/18
          - 190.93.240.0/20
          - 188.114.96.0/20
          - 197.234.240.0/22
          - 198.41.128.0/17
          - 162.158.0.0/15
          - 104.16.0.0/13
          - 104.24.0.0/14
          - 172.64.0.0/13
          - 131.0.72.0/22
          - 2400:cb00::/32
          - 2606:4700::/32
          - 2803:f800::/32
          - 2405:b500::/32
          - 2405:8100::/32
          - 2a06:98c0::/29
          - 2c0f:f248::/32
  services:
    web:
      loadBalancer:
        servers:
          # IP statis service web — network tanpa aardvark, nama tidak resolve
          - url: http://172.29.0.11:3000
