entryPoints:
  web:
    address: ':80'
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ':443'
    # Prod dan dev-server berada di belakang proxy Cloudflare (berkas ini
    # dipakai keduanya). X-Forwarded-For dari peer di rentang ini
    # dipertahankan; Traefik lalu meng-append IP edge sebagai hop terakhir,
    # sehingga XFF = <pembaca>, <edge> dan web membaca hop ke-2 (XFF_DEPTH=2
    # di kedua compose server). Dari peer lain XFF tetap dibuang: salah
    # konfigurasi menghasilkan "tanpa IP", bukan IP yang bisa dipalsukan.
    # Sumber: cloudflare.com/ips-v4 + ips-v6 (2026-09-04); samakan dengan
    # sourceRange di dynamic-prod.yml dan dynamic-dev-server.yml bila berubah.
    forwardedHeaders:
      trustedIPs:
        - 173.245.48.0/20
        - 103.21.244.0/22
        - 103.22.200.0/22
        - 103.31.4.0/22
        - 141.101.64.0/18
        - 108.162.192.0/18
        - 190.93.240.0/20
        - 188.114.96.0/20
        - 197.234.240.0/22
        - 198.41.128.0/17
        - 162.158.0.0/15
        - 104.16.0.0/13
        - 104.24.0.0/14
        - 172.64.0.0/13
        - 131.0.72.0/22
        - 2400:cb00::/32
        - 2606:4700::/32
        - 2803:f800::/32
        - 2405:b500::/32
        - 2405:8100::/32
        - 2a06:98c0::/29
        - 2c0f:f248::/32

providers:
  file:
    filename: /etc/traefik/dynamic.yml

certificatesResolvers:
  le:
    acme:
      # GANTI: email operasional untuk notifikasi Let's Encrypt
      email: admin@example.com
      storage: /letsencrypt/acme.json
      # Di belakang Cloudflare: mode SSL "Full (strict)" dan "Always Use HTTPS"
      # HARUS mati. Let's Encrypt masuk lewat edge Cloudflare ke :80, router
      # tantangan ACME menang atas redirect di entryPoint ini. Bila Cloudflare
      # yang me-redirect ke https, tantangan mendarat di websecure dan
      # pembaruan sertifikat gagal diam-diam 60–90 hari kemudian.
      httpChallenge:
        entryPoint: web

ping: {}
accessLog: {}
